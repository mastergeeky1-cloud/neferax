name: test_install
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  test_install:
    runs-on: ubuntu-latest
    env:
      TERM: "linux"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Non-interactive install
        run: sudo python3 install.py 1
      - name: Verify launcher exists
        run: which neferax && which neferax 2>/dev/null || echo "neferax not on PATH"
      - name: Smoke test neferax CLI
        run: neferax version 2>&1 | head -5
      - name: Smoke test neferax TUI
        run: echo -e "q\n" | timeout 5 neferax || true
      - name: Run neferax info
        run: neferax info nmap
      - name: Run neferax list
        run: neferax list 2>&1 | head -10
