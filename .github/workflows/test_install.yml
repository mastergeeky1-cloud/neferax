name: test_install
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  test_install:
    runs-on: ubuntu-latest
    env:
      TERM: "linux"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Non-interactive install
        run: sudo python3 install.py 1
      - name: Verify launcher exists
        run: which hackingtool && which nefereax 2>/dev/null || echo "nefereax not on PATH"
      - name: Smoke test nefereax CLI
        run: nefereax version 2>&1 | head -5
      - name: Smoke test hackingtool TUI
        run: echo -e "q\n" | timeout 5 hackingtool || true
      - name: Run nefereax info
        run: nefereax info nmap
      - name: Run nefereax list
        run: nefereax list 2>&1 | head -10
