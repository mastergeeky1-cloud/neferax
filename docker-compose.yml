# docker-compose.yml
# Use: docker compose up -d  then  docker exec -it neferax bash
#
# Profiles:
#   (default)  — runs the built image; code is embedded at build time
#   dev        — mounts source directory for live editing without rebuilding
#                docker compose --profile dev up

services:
  neferax:
    build:
      context: .
      dockerfile: Dockerfile
    image: neferax:latest
    container_name: neferax-darkax
    stdin_open: true
    tty: true
    # Persist tools installed at runtime across container restarts
    volumes:
      - neferax_data:/root/.neferax
    restart: unless-stopped

  neferax-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: neferax:latest
    container_name: neferax-darkax-dev
    stdin_open: true
    tty: true
    profiles:
      - dev
    volumes:
      # Live source mount — code changes are visible without rebuilding
      - .:/root/neferax
      - neferax_data:/root/.neferax
    restart: "no"

volumes:
  neferax_data:
